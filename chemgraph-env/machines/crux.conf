# Crux: CPU-only AMD EPYC; uv venv, CPU torch.
MACHINE=crux
SHARED=/grand/catalyst/world-shared/chemgraph/crux
SRC=$SHARED/src
ENV_KIND=uv
ENV_PREFIX=$SHARED/alcf_chemgraph_env
ACTIVATE=$SHARED/activate_chemgraph.sh
UV_PYTHON_INSTALL_DIR=/grand/catalyst/world-shared/chemgraph/uv/python
UV_CACHE_DIR=/grand/catalyst/world-shared/chemgraph/uv/cache
DEVICE=cpu
TORCH_SPEC=torch==2.13.0+cpu
TORCH_INDEX=https://download.pytorch.org/whl/cpu
INDEX_ARGS=
# uv resolves a matscipy that takes ChemGraph's numpy==2.2.6: no re-pin.
NUMPY_PIN=
CHEMGRAPH_EXTRAS=parsl,ensemble_launcher,test,calculators
THREADS=16
PBS_ACCOUNT=Catalyst
PBS_QUEUE=debug
PBS_SELECT=1:ncpus=256
PBS_FILESYSTEMS=home:grand
PBS_WALLTIME=01:00:00
PYTEST_ARGS="--deselect tests/test_deep_agent_cli_review.py::test_tty_queued_enters_cannot_approve_next_action"
