# Polaris: 4x NVIDIA A100 per node; conda env, CUDA torch from PyPI.
MACHINE=polaris
SHARED=/grand/catalyst/world-shared/chemgraph
SRC=$SHARED
ENV_KIND=conda
ENV_PREFIX=$SHARED/alcf_chemgraph_env
CONDA_SH=/soft/applications/conda/2025-09-25/mconda3/etc/profile.d/conda.sh
ACTIVATE=$SHARED/activate_chemgraph.sh
DEVICE=cuda
TORCH_SPEC=torch==2.13.0
INDEX_ARGS=
# matscipy in this env needs numpy<2 (ChemGraph pins 2.2.6): re-pin after installs.
NUMPY_PIN=1.26.4
CHEMGRAPH_EXTRAS=parsl,ensemble_launcher,test
THREADS=8
PBS_ACCOUNT=ChemGraph
PBS_QUEUE=debug
# debug allows one queued job per user; fall back when it is taken.
PBS_QUEUE_FALLBACK=preemptable
PBS_SELECT=1:system=polaris
PBS_FILESYSTEMS=home:grand
PBS_WALLTIME=01:00:00
# Waits 30 s for a CLI prompt; a cold import over Lustre takes longer.
PYTEST_ARGS="--deselect tests/test_deep_agent_cli_review.py::test_tty_queued_enters_cannot_approve_next_action"
