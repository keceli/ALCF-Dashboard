# Aurora: Intel Data Center GPU Max (PVC); conda env, torch from the XPU index.
MACHINE=aurora
SHARED=/lus/flare/projects/catalyst/world_shared/chemgraph
SRC=$SHARED/src
ENV_KIND=conda
ENV_PREFIX=$SHARED/alcf_chemgraph_env
CONDA_SH=/opt/aurora/26.26.0/spack/unified/1.1.1/install/linux-x86_64/miniforge3-25.11.0-1-khkcc6i/etc/profile.d/conda.sh
ACTIVATE=$SHARED/activate_chemgraph.sh
DEVICE=xpu
TORCH_SPEC=torch==2.12.1+xpu
# Every pip call resolves against the XPU index first, so no CUDA wheel can win.
INDEX_ARGS="--index-url https://download.pytorch.org/whl/xpu --extra-index-url https://pypi.org/simple"
# matscipy in this env needs numpy<2 (ChemGraph pins 2.2.6): re-pin after installs.
NUMPY_PIN=1.26.4
CHEMGRAPH_EXTRAS=parsl,ensemble_launcher,test
THREADS=8
PBS_ACCOUNT=ChemGraph
PBS_QUEUE=debug
PBS_SELECT=1
PBS_FILESYSTEMS=home:flare
PBS_WALLTIME=01:00:00
