name: Dashboard

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Refresh the public system status, plus projects and jobs if the
    # ALCF_IRI_TOKEN secret is set, every 30 minutes.
    - cron: "*/30 * * * *"
  # Also started by scripts/update_dashboard.sh --push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Let Pages deployments finish; only superseded pull request runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the latest snapshot
        # Pushed by scripts/update_dashboard.sh --push; absent until its first push.
        run: |
          if git fetch --quiet --depth=1 origin dashboard-data; then
            git show FETCH_HEAD:dashboard.json > docs/data/dashboard.json
          else
            echo "No dashboard-data branch yet"
          fi
      - name: Refresh IRI API data
        env:
          ALCF_IRI_TOKEN: ${{ secrets.ALCF_IRI_TOKEN }}
          ALCF_IRI_URL: ${{ vars.ALCF_IRI_URL }}
          ALCF_USER: ${{ vars.ALCF_USER }}
        # SSH needs MFA, so only the IRI API is queried here (without a token,
        # just the public system status); --merge keeps everything else, and
        # --no-config publishes only the projects the snapshot already shows.
        run: |
          [ -n "$ALCF_IRI_URL" ] || unset ALCF_IRI_URL
          python collector/alcf_dashboard.py --no-ssh --no-config \
            --merge docs/data/dashboard.json -o docs/data/dashboard.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
