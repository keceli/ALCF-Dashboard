name: Dashboard

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Refresh IRI data every 30 minutes (only if the ALCF_IRI_TOKEN secret is set).
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh IRI API data
        env:
          ALCF_IRI_TOKEN: ${{ secrets.ALCF_IRI_TOKEN }}
          ALCF_IRI_URL: ${{ vars.ALCF_IRI_URL }}
        if: env.ALCF_IRI_TOKEN != ''
        # SSH needs MFA, so only the IRI API is queried here. SSH data committed
        # in docs/data/dashboard.json is preserved via --merge.
        run: |
          [ -n "$ALCF_IRI_URL" ] || unset ALCF_IRI_URL
          python collector/alcf_dashboard.py --no-ssh \
            --merge docs/data/dashboard.json -o docs/data/dashboard.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
